            left: 0;

            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        .header-title {
            display: flex;
            flex-direction: column;
        }

        .header-title h1 {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(90deg, #c4b5fd, #f9a8d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.3px;
        }

        .header-title span {
            font-size: 11px;
            color: rgba(196, 181, 253, 0.6);
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header-stats {
            display: flex;
            gap: 20px;
        }

        .stat-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 12px;
        }

        .stat-badge .num {
            font-weight: 700;
            color: #a78bfa;
            font-size: 14px;
        }

        .stat-badge .label {
            color: rgba(196, 181, 253, 0.7);
        }

        /* Map */
        #map {
            position: fixed;
            top: 68px;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
        }

        /* Side Panel */
        .side-panel {
            position: fixed;
            top: 68px;
            left: 0;
            bottom: 0;
            width: 380px;
            z-index: 500;
            background: linear-gradient(180deg, rgba(15, 15, 35, 0.96), rgba(10, 10, 26, 0.98));
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(139, 92, 246, 0.15);
            overflow-y: auto;
            transform: translateX(0);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .side-panel.collapsed {
            transform: translateX(-380px);
        }

        .panel-toggle {
            position: fixed;
            top: 80px;
            left: 380px;
            z-index: 501;
            width: 32px;
            height: 48px;
            background: rgba(15, 15, 35, 0.95);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-left: none;
            border-radius: 0 10px 10px 0;
            color: #a78bfa;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .panel-toggle.collapsed {
            left: 0;
        }

        .panel-toggle:hover {
            background: rgba(139, 92, 246, 0.2);
        }

        .panel-section {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(139, 92, 246, 0.1);
        }

        .panel-section h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(139, 92, 246, 0.7);
            margin-bottom: 12px;
            font-weight: 600;
        }

        /* Search */
        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            background: rgba(139, 92, 246, 0.08);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 10px;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            outline: none;
            transition: all 0.3s;
        }

        .search-box input:focus {
            border-color: rgba(139, 92, 246, 0.5);
            background: rgba(139, 92, 246, 0.12);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.1);
        }

        .search-box input::placeholder {
            color: rgba(196, 181, 253, 0.4);
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            opacity: 0.5;
        }

        /* Legend */
        .legend-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 11px;
        }

        .legend-item:hover {
            background: rgba(139, 92, 246, 0.1);
        }

        .legend-item.active {
            background: rgba(139, 92, 246, 0.15);
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 8px currentColor;
        }

        /* Location List */
        .location-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .location-card {
            padding: 10px 14px;
            background: rgba(139, 92, 246, 0.04);
            border: 1px solid rgba(139, 92, 246, 0.08);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .location-card:hover {
            background: rgba(139, 92, 246, 0.1);
            border-color: rgba(139, 92, 246, 0.25);
            transform: translateX(4px);
        }

        .location-card.selected {
            background: rgba(139, 92, 246, 0.15);
            border-color: rgba(139, 92, 246, 0.4);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.1);
        }

        .location-card .loc-name {
            font-size: 13px;
            font-weight: 600;
            color: #c4b5fd;
            margin-bottom: 3px;
        }

        .location-card .loc-region {
            font-size: 11px;
            color: rgba(196, 181, 253, 0.5);
        }

            font-size: 10px;
            padding: 2px 8px;
            border-radius: 12px;
            margin-top: 4px;
            font-weight: 500;
        }

            border: 1px solid rgba(139, 92, 246, 0.3) !important;
            border-radius: 16px !important;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(139, 92, 246, 0.15) !important;

            padding: 0 !important;
            min-width: 320px !important;
        }

        .leaflet-popup-content {
            margin: 0 !important;
            line-height: 1.5 !important;
        }

        .leaflet-popup-tip {
            background: rgba(25, 20, 55, 0.98) !important;
            border: 1px solid rgba(139, 92, 246, 0.3) !important;
            border-top: none !important;
            border-left: none !important;

        }

            font-weight: 700;
            color: #c4b5fd;
            margin-bottom: 4px;

            letter-spacing: 1px;
            color: rgba(139, 92, 246, 0.6);
            font-weight: 600;
            margin-bottom: 3px;

            color: #d4d4d8;
            line-height: 1.5;

            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            margin-right: 4px;
            margin-bottom: 4px;

            padding: 10px 14px;
            background: rgba(139, 92, 246, 0.06);

            margin-top: 8px;

            color: #a78bfa;

            position: relative;
        }

        .marker-pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.8); opacity: 0; }
        }

        /* Scrollbar */
        .side-panel::-webkit-scrollbar {
            width: 4px;
        }

        .side-panel::-webkit-scrollbar-track {
            background: transparent;
        }

        .side-panel::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.3);
            border-radius: 4px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .side-panel {
                width: 100%;
                height: 45%;
                top: auto;
                bottom: 0;
                left: 0;
                right: 0;
                border-right: none;
                border-top: 1px solid rgba(139, 92, 246, 0.2);
                transform: translateY(0);
            }

            .side-panel.collapsed {
                transform: translateY(100%);
            }

            .panel-toggle {
                top: auto;
                bottom: 45%;
                left: 50%;
                transform: translateX(-50%);
                width: 48px;
                height: 28px;
                border-radius: 10px 10px 0 0;
                border-bottom: none;
            }

            .header-stats {
                display: none;
            }
        }

        /* Attribution styling */
        .leaflet-control-attribution {
            background: rgba(15, 15, 35, 0.8) !important;
            color: rgba(196, 181, 253, 0.5) !important;
            font-size: 10px !important;
        }

        .leaflet-control-attribution a {
            color: rgba(139, 92, 246, 0.7) !important;
        }

        /* Zoom controls */
        .leaflet-control-zoom a {
            background: rgba(15, 15, 35, 0.95) !important;
            color: #a78bfa !important;
            border: 1px solid rgba(139, 92, 246, 0.3) !important;
        }

        .leaflet-control-zoom a:hover {
            background: rgba(139, 92, 246, 0.2) !important;
        }
    </style>
</head>

// ==============================================================
// CATEGORY CONFIG
// ==============================================================
const categories = {
    batholith: { label: "Batolitos", color: "#8b5cf6", icon: "⛰️" },
    paleozoic: { label: "Paleozoico", color: "#06b6d4", icon: "🔷" },
    mesozoic: { label: "Mesozoico", color: "#10b981", icon: "🟢" },
    cenozoic: { label: "Cenozoico", color: "#f59e0b", icon: "🟡" },
    special: { label: "Monumento Natural", color: "#ec4899", icon: "⭐" }
};

// ==============================================================
// INIT MAP
// ==============================================================
const map = L.map('map', {
    center: [-36.0, -71.0],
    zoom: 4,
    zoomControl: true,
    attributionControl: true,
    zoomSnap: 0.5,
    wheelPxPerZoomLevel: 120
});

// Dark tile layer
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
    maxZoom: 19
}).addTo(map);

// Chile border outline (simplified)
const chileBorder = L.polyline([
    [-17.5, -69.5], [-18.5, -70.3], [-20.0, -70.1], [-22.0, -70.0],
    [-24.0, -70.5], [-26.0, -70.6], [-27.1, -70.9], [-29.0, -71.3],
    [-30.0, -71.5], [-31.0, -71.6], [-33.0, -71.6], [-34.0, -72.0],
    [-36.0, -73.0], [-38.0, -73.5], [-40.0, -73.7], [-42.0, -74.0],
    [-44.0, -74.5], [-46.0, -75.0], [-48.0, -75.5], [-50.0, -75.3],
    [-52.0, -74.0], [-53.5, -71.5], [-55.0, -69.0], [-55.8, -67.5]
], {
    color: 'rgba(139, 92, 246, 0.2)',
    weight: 1.5,
    dashArray: '8, 6'
}).addTo(map);

// ==============================================================
// MARKERS & LAYERS
// ==============================================================
const markers = {};
const markerLayers = {};
let selectedCard = null;
let activeFilters = new Set(Object.keys(categories));

function createMarkerIcon(category, size = 14) {
    const color = categories[category].color;
    return L.divIcon({
        className: 'custom-marker',
        html: `
            <div style="position:relative;width:${size}px;height:${size}px;">
                <div class="marker-pulse" style="background:${color};"></div>
                <div style="
                    width:${size}px;height:${size}px;
                    background: radial-gradient(circle, ${color}, ${color}aa);
                    border-radius:50%;
                    border: 2px solid rgba(255,255,255,0.5);
                    box-shadow: 0 0 ${size}px ${color}88, 0 0 ${size * 2}px ${color}44;
                    position:absolute;top:0;left:0;
                "></div>
            </div>`,
        iconSize: [size, size],
        iconAnchor: [size / 2, size / 2],
        popupAnchor: [0, -size / 2 - 4]
    });
}

function createPopupContent(occ) {
    const cat = categories[occ.category];
    const mineralTags = occ.minerals.map(m =>
        `<span class="popup-tag" style="background:${cat.color}22;color:${cat.color};border:1px solid ${cat.color}44;">${m}</span>`
    ).join('');

    return `
        <div class="popup-content">
            <div class="popup-header">
                <h3>${cat.icon} ${occ.name}</h3>
                <div class="popup-region">${occ.region} · ${occ.type}</div>
            </div>
            <div class="popup-body">
                <div class="popup-field">
                    <div class="field-label">Litología</div>
                    <div class="field-value">${occ.lithology}</div>
                </div>
                <div class="popup-field">
                    <div class="field-label">Edad</div>
                    <div class="field-value">${occ.age}</div>
                </div>
                <div class="popup-field">
                    <div class="field-label">Mineralogía</div>
                    <div class="field-value">${mineralTags}</div>
                </div>
                <div class="popup-field">
                    <div class="field-label">Contexto Geológico</div>
                    <div class="field-value">${occ.context}</div>
                </div>
                <div class="popup-coords">
                    <div>
                        <div class="coord-label">Latitud</div>
                        <div class="coord">${occ.lat.toFixed(4)}°</div>
                    </div>
                    <div>
                        <div class="coord-label">Longitud</div>
                        <div class="coord">${occ.lng.toFixed(4)}°</div>
                    </div>
                </div>
                <div style="margin-top:10px;font-size:10px;color:rgba(196,181,253,0.4);">Fuente: ${occ.source}</div>
            </div>
        </div>
    `;
}

// Add markers to map
occurrences.forEach((occ, idx) => {
    const marker = L.marker([occ.lat, occ.lng], {
        icon: createMarkerIcon(occ.category, occ.category === 'special' ? 18 : 14)
    }).addTo(map);

    marker.bindPopup(createPopupContent(occ), {
        maxWidth: 360,
        minWidth: 320,
        className: 'custom-popup'
    });

    marker.on('click', () => {
        selectLocation(idx);
    });

    markers[idx] = marker;
});

// ==============================================================
// SIDE PANEL
// ==============================================================
function buildLegend() {
    const grid = document.getElementById('legendGrid');
    grid.innerHTML = '';
    Object.entries(categories).forEach(([key, cat]) => {
        const item = document.createElement('div');
        item.className = `legend-item ${activeFilters.has(key) ? 'active' : ''}`;
        item.innerHTML = `
            <div class="legend-dot" style="background:${cat.color};color:${cat.color};"></div>
            <span>${cat.icon} ${cat.label}</span>
        `;
        item.onclick = () => toggleFilter(key);
        grid.appendChild(item);
    });
}

function buildLocationList(filter = '') {
    const list = document.getElementById('locationList');
    list.innerHTML = '';
    let count = 0;

    occurrences.forEach((occ, idx) => {
        if (!activeFilters.has(occ.category)) return;
        if (filter) {
            const search = filter.toLowerCase();
            const match = occ.name.toLowerCase().includes(search) ||
                          occ.region.toLowerCase().includes(search) ||
                          occ.type.toLowerCase().includes(search) ||
                          occ.lithology.toLowerCase().includes(search);
            if (!match) return;
        }

        count++;
        const cat = categories[occ.category];
        const card = document.createElement('div');
        card.className = 'location-card';
        card.id = `loc-${idx}`;
        card.innerHTML = `
            <div class="loc-name">${cat.icon} ${occ.name}</div>
            <div class="loc-region">${occ.region}</div>
            <span class="loc-type" style="background:${cat.color}18;color:${cat.color};border:1px solid ${cat.color}33;">${occ.type}</span>
        `;
        card.onclick = () => {
            map.setView([occ.lat, occ.lng], 10, { animate: false });
            markers[idx].openPopup();
            selectLocation(idx);
        };
        list.appendChild(card);
    });

    document.getElementById('visible-count').textContent = count;
}

function selectLocation(idx) {
    if (selectedCard) selectedCard.classList.remove('selected');
    const card = document.getElementById(`loc-${idx}`);
    if (card) {
        card.classList.add('selected');
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        selectedCard = card;
    }
}

function toggleFilter(category) {
    if (activeFilters.has(category)) {
        activeFilters.delete(category);
    } else {
        activeFilters.add(category);
    }

    // Show/hide markers
    occurrences.forEach((occ, idx) => {
        if (activeFilters.has(occ.category)) {
            markers[idx].addTo(map);
        } else {
            map.removeLayer(markers[idx]);
        }
    });

    buildLegend();
    buildLocationList(document.getElementById('searchInput').value);
}

function togglePanel() {
    const panel = document.getElementById('sidePanel');
    const toggle = document.getElementById('panelToggle');
    panel.classList.toggle('collapsed');
    toggle.classList.toggle('collapsed');
    toggle.textContent = panel.classList.contains('collapsed') ? '▶' : '◀';
    setTimeout(() => map.invalidateSize(), 400);
}

// Search
document.getElementById('searchInput').addEventListener('input', (e) => {
    buildLocationList(e.target.value);
});

// ==============================================================
// INIT
// ==============================================================
const uniqueRegions = new Set(occurrences.map(o => o.region));
document.getElementById('total-count').textContent = occurrences.length;
document.getElementById('region-count').textContent = uniqueRegions.size;

buildLegend();
buildLocationList();

// Fit bounds to show all markers precisely
const allPoints = occurrences.map(o => [o.lat, o.lng]);
const markerBounds = L.latLngBounds(allPoints);
map.fitBounds(markerBounds, { padding: [40, 40], animate: false, maxZoom: 6 });
</script>
